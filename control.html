<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Politécnico Superior - Control de Asistencia en Vivo</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background-color: #f0f2f5;
    }
    .admin-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .counter-badge {
      background-color: #ED1C24;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
    }
    .btn-export {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-export:hover {
      background-color: #218838;
    }
    .table-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.92rem;
    }
    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
    }
    th {
      background-color: #f8f9fa;
      color: #333;
      font-weight: 700;
    }
    tr:hover {
      background-color: #fdf2f2;
    }
    .badge-num {
      background-color: #ffebee;
      color: #ED1C24;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <div>
        <img src="logo-politecnico.png" alt="Politécnico Superior" style="max-height: 50px;">
        <h2 style="margin-top: 8px; color: #333;">Monitoreo de Asistentes en Vivo 🔴</h2>
      </div>
      <div class="header-actions">
        <div class="counter-badge">
          Total: <span id="total-count">0</span>
        </div>
        <button id="export-btn" class="btn-export">📥 Descargar Excel</button>
      </div>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th># Rifa</th>
            <th>Nombre Completo</th>
            <th>Celular</th>
            <th>WhatsApp</th>
            <th>Colegio</th>
            <th>Grado</th>
            <th>Hora</th>
          </tr>
        </thead>
        <tbody id="attendees-list">
          <tr>
            <td colspan="7" style="text-align: center; padding: 20px; color: #777;">Cargando registros...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      if (!window.APP_CONFIG || !window.APP_CONFIG.SUPABASE_URL || !window.APP_CONFIG.SUPABASE_ANON_KEY) {
        alert("Error: Archivo config.js no configurado.");
        return;
      }

      const supabase = window.supabase.createClient(
        window.APP_CONFIG.SUPABASE_URL,
        window.APP_CONFIG.SUPABASE_ANON_KEY
      );

      const tbody = document.getElementById("attendees-list");
      const totalCount = document.getElementById("total-count");
      const exportBtn = document.getElementById("export-btn");
      let currentData = [];

      async function fetchAttendees() {
        const { data, error } = await supabase
          .from("attendees")
          .select("*")
          .eq("event_id", window.APP_CONFIG.EVENT_ID)
          .order("created_at", { ascending: false });

        if (error) {
          console.error("Error al cargar asistentes:", error);
          return;
        }

        currentData = data || [];
        totalCount.textContent = currentData.length;

        if (currentData.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 20px;">Aún no hay asistentes registrados.</td></tr>';
          return;
        }

        tbody.innerHTML = currentData.map(item => {
          const date = new Date(item.created_at);
          const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          const raffleFormatted = String(item.raffle_number || 0).padStart(3, "0");

          return `
            <tr>
              <td><span class="badge-num">${raffleFormatted}</span></td>
              <td><strong>${item.full_name}</strong></td>
              <td>${item.phone}</td>
              <td>${item.whatsapp}</td>
              <td>${item.school}</td>
              <td>${item.grade_level}</td>
              <td>${timeStr}</td>
            </tr>
          `;
        }).join("");
      }

      // Función para exportar los datos a CSV compatible con Excel
      exportBtn.addEventListener("click", () => {
        if (!currentData || currentData.length === 0) {
          alert("No hay datos para exportar.");
          return;
        }

        const headers = ["Numero Rifa", "Nombre Completo", "Celular", "WhatsApp", "Colegio", "Grado", "Fecha y Hora"];
        const rows = currentData.map(item => [
          `"${String(item.raffle_number || 0).padStart(3, '0')}"`,
          `"${item.full_name.replace(/"/g, '""')}"`,
          `"${item.phone}"`,
          `"${item.whatsapp}"`,
          `"${item.school.replace(/"/g, '""')}"`,
          `"${item.grade_level}"`,
          `"${new Date(item.created_at).toLocaleString()}"`
        ]);

        const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `Asistentes_Politecnico_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      });

      // Carga inicial
      await fetchAttendees();

      // Suscripción a cambios en tiempo real
      supabase
        .channel('public:attendees')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'attendees' }, () => {
          fetchAttendees();
        })
        .subscribe();
    });
  </script>
</body>
</html>
