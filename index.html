<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Politécnico Superior - Registro de Asistencia y Rifa</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Politécnico Superior</h1>
      <p class="subtitle">Registro de Asistencia y Sorteo de Rifa</p>
    </header>

    <main>
      <!-- Formulario de Registro -->
      <form id="registration-form" class="card">
        <h2>Formulario de Registro</h2>

        <div class="form-group">
          <label for="fullName">Nombre Completo *</label>
          <input type="text" id="fullName" placeholder="Ej. Juan Pérez" required>
        </div>

        <div class="form-group">
          <label for="documentId">Documento de Identidad *</label>
          <input type="text" id="documentId" placeholder="Ej. 1098765432" required>
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico *</label>
          <input type="email" id="email" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="form-group">
          <label for="phone">Número Celular (SMS) *</label>
          <input type="tel" id="phone" placeholder="Ej. 3001234567" required>
        </div>

        <div class="form-group checkbox-group">
          <input type="checkbox" id="consent" required>
          <label for="consent">Acepto la autorización y tratamiento de datos personales.</label>
        </div>

        <button type="submit" id="submit-btn" class="btn-primary">Registrar Asistencia</button>
      </form>

      <!-- Mensajes de Estado / Avisos -->
      <div id="notice" class="notice hidden"></div>

      <!-- Tarjeta del Número de Rifa -->
      <div id="result-card" class="card result-card hidden">
        <h3>¡Registro Completado!</h3>
        <p>Tu número asignado para la rifa es:</p>
        <div class="raffle-badge">
          <span id="raffle-number-display">000</span>
        </div>
        <p class="sms-note">Te hemos enviado un mensaje de texto de confirmación a tu celular.</p>
      </div>
    </main>
  </div>

  <!-- Carga de scripts en orden estricto -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
